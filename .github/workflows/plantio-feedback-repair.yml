name: Plantio feedback repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo '' | base64 -d > /tmp/fix.py
          python3 /tmp/fix.py
          rm -f .github/workflows/plantio-feedback-repair.yml .github/workflows/plantio-feedback-fix.yml .github/workflows/plantio-contact-fix.yml .github/workflows/plantio-beta-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/feedback/page.tsx .github/workflows/
          git commit -m "fix: connect feedback form to Turso [skip ci]" || exit 0
          git push
