name: One-time audit repairs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'chore: apply audit repairs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified audit fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected audit target not found: {path}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          # Weather: use the real icon union instead of the removed CURRENT symbol.
          replace(
              "src/app/weather/page.tsx",
              'kind: ForecastDay["icon"] | typeof CURRENT["condition"];',
              'kind: ForecastDay["icon"];',
          )
          replace(
              "src/app/weather/page.tsx",
              '    case "cloud-sun":\n    case "partly-cloudy":\n',
              '    case "cloud-sun":\n',
          )

          # Yield: narrow the CropId | "" union without an impossible comparison.
          replace(
              "src/app/yield/page.tsx",
              'if (!canCalculate || crop === "") return;',
              'if (!canCalculate || !crop) return;',
          )

          # Rotation: validate the language key before indexing LocalizedText.
          replace(
              "src/app/rotation/page.tsx",
              '(text: LocalizedText) => text[lang] ?? text.en,',
              '(text: LocalizedText) => {\n      const key = lang === "hi" || lang === "mr" ? lang : "en";\n      return text[key];\n    },',
          )

          # Defensive rendering for the public legal pages.
          replace(
              "src/app/terms/page.tsx",
              '{sections.map(([title, text]) => (',
              '{sections?.map(([title, text]) => (',
          )
          replace(
              "src/app/privacy/page.tsx",
              '{sections.map(([title, text]) => (',
              '{sections?.map(([title, text]) => (',
          )
          PY

      - name: Commit repairs and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-audit-repairs.yml
          git add src/app/weather/page.tsx src/app/yield/page.tsx src/app/rotation/page.tsx src/app/terms/page.tsx src/app/privacy/page.tsx .github/workflows/one-time-audit-repairs.yml
          git commit -m "chore: apply audit repairs"
          git push
