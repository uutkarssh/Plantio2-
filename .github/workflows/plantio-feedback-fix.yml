name: Plantio feedback wiring
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire feedback form to Turso
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/feedback/page.tsx')
          s=p.read_text()
          old='''const handleSubmit = (e: React.FormEvent<HTMLFormElement>) => {
    e.preventDefault();
    if (!validate()) return;
    addFeedback({
      type,
      subject: subject.trim(),
      message: message.trim(),
      email: email.trim() || undefined,
    });
    setSubmitted(true);
  };'''
          new='''const handleSubmit = async (e: React.FormEvent<HTMLFormElement>) => {
    e.preventDefault();
    if (!validate()) return;
    try {
      const response = await fetch("/api/feedback", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          type,
          subject: subject.trim(),
          message: message.trim(),
          email: email.trim() || undefined,
        }),
      });
      if (!response.ok) throw new Error("Feedback save failed");
      addFeedback({
        type,
        subject: subject.trim(),
        message: message.trim(),
        email: email.trim() || undefined,
      });
      setSubmitted(true);
    } catch {
      setErrors((prev) => ({
        ...prev,
        message: "Could not save your feedback. Please try again.",
      }));
    }
  };'''
          if old not in s:
              raise SystemExit('Expected feedback handler not found')
          p.write_text(s.replace(old,new,1))
          PY
          rm -f .github/workflows/plantio-feedback-fix.yml .github/workflows/plantio-contact-fix.yml .github/workflows/plantio-beta-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/feedback/page.tsx .github/workflows/plantio-feedback-fix.yml .github/workflows/plantio-contact-fix.yml .github/workflows/plantio-beta-fix.yml
          git commit -m "feat: persist Plantio feedback in Turso [skip ci]" || exit 0
          git push
