name: Fix Plantio contact emails
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/app/feedback/page.tsx')
          s = p.read_text()
          old = 'href="mailto:hello@plantio.app"'
          if old in s:
              start = s.index('                <a\n                  href="mailto:hello@plantio.app"')
              end = s.index('                <div className="mt-3 flex items-center gap-2">', start)
              end = s.index('                </div>', end) + len('                </div>')
              block = '''                <div className="mt-3 space-y-2.5">
                  <a href="mailto:utkarshmaurya917027@gmail.com" className="flex w-full max-w-full min-w-0 items-center gap-2 rounded-2xl border-[2.5px] border-ink bg-white px-3 py-2.5 font-display text-xs sm:text-sm font-bold uppercase text-ink shadow-[3px_3px_0px_0px_#161611]">
                    <Mail className="w-4 h-4 shrink-0 text-forest" strokeWidth={2.5} />
                    <span className="min-w-0 break-all">utkarshmaurya917027@gmail.com</span>
                  </a>
                  <a href="mailto:utkarshmaurya88409@gmail.com" className="flex w-full max-w-full min-w-0 items-center gap-2 rounded-2xl border-[2.5px] border-ink bg-white px-3 py-2.5 font-display text-xs sm:text-sm font-bold uppercase text-ink shadow-[3px_3px_0px_0px_#161611]">
                    <Mail className="w-4 h-4 shrink-0 text-forest" strokeWidth={2.5} />
                    <span className="min-w-0 break-all">utkarshmaurya88409@gmail.com</span>
                  </a>
                </div>
                <div className="mt-3 w-full max-w-full">
                  <StickerBadge variant="leaf" className="flex w-full max-w-full items-center justify-center gap-1.5 px-3 py-2 text-[10px] sm:text-xs leading-tight text-center whitespace-normal">
                    <CheckCircle2 className="w-3.5 h-3.5 shrink-0" strokeWidth={2.5} />
                    <span className="min-w-0 break-words">{t("feedback.responseTime")}</span>
                  </StickerBadge>
                </div>'''
              s = s[:start] + block + s[end:]
              p.write_text(s)

          p = Path('src/app/about/page.tsx')
          s = p.read_text()
          old = 'href="mailto:utkarshmaurya917027@gmail.com"'
          marker = '                  {t("about.demoAddress")}\n'
          if old in s and marker in s:
              start = s.index('                <a\n                  href="mailto:utkarshmaurya917027@gmail.com"')
              end = s.index('                </p>', start) + len('                </p>')
              block = '''                <div className="mt-3 space-y-2.5">
                  <a href="mailto:utkarshmaurya917027@gmail.com" className="flex w-full max-w-full min-w-0 items-center gap-2 rounded-2xl border-[2.5px] border-ink bg-white px-3 py-2.5 font-display text-xs sm:text-sm font-bold uppercase shadow-[3px_3px_0px_0px_#161611]">
                    <Mail className="w-4 h-4 shrink-0 text-forest" strokeWidth={2.5} />
                    <span className="min-w-0 break-all">utkarshmaurya917027@gmail.com</span>
                  </a>
                  <a href="mailto:utkarshmaurya88409@gmail.com" className="flex w-full max-w-full min-w-0 items-center gap-2 rounded-2xl border-[2.5px] border-ink bg-white px-3 py-2.5 font-display text-xs sm:text-sm font-bold uppercase shadow-[3px_3px_0px_0px_#161611]">
                    <Mail className="w-4 h-4 shrink-0 text-forest" strokeWidth={2.5} />
                    <span className="min-w-0 break-all">utkarshmaurya88409@gmail.com</span>
                  </a>
                </div>'''
              s = s[:start] + block + s[end:]
              p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/feedback/page.tsx src/app/about/page.tsx
          git commit -m "fix: apply contact email layout [skip ci]" || exit 0
          git push
