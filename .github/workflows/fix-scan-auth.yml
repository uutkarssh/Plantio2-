name: Apply scan auth fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch scan client
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/app/scan/page.tsx')
          s = p.read_text()

          if 'import { firebaseAuth } from "@/lib/firebase/config";' not in s:
              marker = 'import { openAskPlantio } from "@/lib/plantio/ask-plantio-state";\n'
              if marker not in s:
                  raise SystemExit('Could not find import insertion point')
              s = s.replace(marker, marker + 'import { firebaseAuth } from "@/lib/firebase/config";\n', 1)

          old = '''const res = await fetch("/api/scan", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image: imageDataUrl }),
        signal: controller.signal,
      });
      clearTimeout(timeout);
      clearInterval(msgTimer);
      const data = await res.json();
      if (!res.ok && !data?.result) {
        throw new Error(data?.error || "Scan failed");
      }'''

          new = '''const user = firebaseAuth.currentUser;
      if (!user) {
        throw new Error("Please sign in before scanning.");
      }
      const token = await user.getIdToken(true);

      const res = await fetch("/api/scan", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${token}`,
        },
        body: JSON.stringify({ image: imageDataUrl }),
        signal: controller.signal,
      });
      clearTimeout(timeout);
      clearInterval(msgTimer);
      const data = await res.json();
      if (res.status === 401) {
        throw new Error(data?.message || "Please sign in before scanning.");
      }
      if (!res.ok && !data?.result) {
        throw new Error(data?.error || "Scan failed");
      }'''

          if old not in s:
              if 'Authorization: `Bearer ${token}`' not in s:
                  raise SystemExit('Could not find expected scan fetch block')
          else:
              s = s.replace(old, new, 1)

          p.write_text(s)

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-scan-auth.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/scan/page.tsx .github/workflows/fix-scan-auth.yml
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "fix: send Firebase token with plant scans"
          git push
